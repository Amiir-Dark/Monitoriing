services:
  nodewatch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodewatch-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODEWATCH_PORT=8080
      - NODEWATCH_DATABASE=/app/data/nodewatch.db
      - NODEWATCH_SECRET=change-this-to-a-strong-secret-in-production!
      - NODEWATCH_SERVER_URL=http://localhost:8080
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
